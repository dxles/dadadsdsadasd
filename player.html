<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şimdi Çalıyor — Çınla</title>
<link rel="stylesheet" href="player.css">
</head>
<body>

<div class="bg-blur" id="bgBlur"></div>
<div class="bg-overlay"></div>

<a href="index.html" class="back-link" id="backLink">← Listeye dön</a>

<div class="stage" id="stage">
  <div class="now-row">
    <div class="cover-wrap" id="coverWrap">
      <img id="coverImg" class="cover" alt="">
    </div>
    <div class="track-meta">
      <div id="trackTitle" class="track-title">—</div>
      <div id="trackChannel" class="track-channel">—</div>
      <div class="progress-area">
        <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
        <div class="time-row">
          <span id="curTime">0:00</span>
          <span id="durTime">0:00</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="equalizer-container" id="equalizer" aria-hidden="true">
  <span></span><span></span><span></span><span></span>
</div>

<div class="lyrics-container" id="lyricsContainerOuter">
  <div id="lyricsStatus" class="lyrics-status">Sözler yükleniyor...</div>
  <div id="lyricsContent"></div>
</div>

<div class="controls">
  <button id="shuffleBtn" class="ctrl-btn toggle-btn" title="Karıştır">⤨</button>
  <button id="backBtn" class="ctrl-btn" title="10 sn geri">⟲</button>
  <button id="playBtn" class="ctrl-btn play-btn" title="Oynat / Duraklat">▶</button>
  <button id="fwdBtn" class="ctrl-btn" title="10 sn ileri">⟳</button>
  <button id="repeatBtn" class="ctrl-btn toggle-btn" title="Tekrarla">↻</button>
  <span class="ctrl-sep"></span>
  <button id="muteBtn" class="ctrl-btn" title="Sesi kapat/aç">🔊</button>
  <input type="range" id="volumeSlider" min="0" max="100" value="100" step="1" title="Ses seviyesi">
</div>

<button id="videoToggleBtn">Video Göster</button>
<button id="videoHideBtn">Videoyu Gizle</button>

<div class="video-frame-wrap" id="videoFrame"></div>

<div id="ytPlayerHost"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="youtube-player.js"></script>
<script src="player.js"></script>
</body>
</html>
